<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Exercise 3: Contact & Calculator</title>
</head>
<body>

    <!-- 1. Header Section -->
    <div>
        <h1>Welcome to Our Interactive Portal</h1>
        <span>Connecting people and computing solutions effortlessly.</span>
    </div>

    <hr>

    <!-- 2. Content Section (Contains Contact Form and Calculator) -->
    <div>
        <!-- Contact Form Component -->
        <form action="#" method="POST">
            <h2>Contact Us</h2>
            
            <p>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="contact-date">Preferred Contact Date:</label>
                <input type="date" id="contact-date" name="contact-date">
            </p>

            <p>
                <label for="satisfaction">Satisfaction Level:</label>
                <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5">
            </p>

            <p>
                <button type="submit">Submit Inquiry</button>
            </p>
        </form>

        <hr>

        <!-- 3. Inline Calculator Component inside Content Section -->
        <div>
            <h2>Inline Addition Calculator</h2>
            <form oninput="total.value = (parseFloat(num1.value) || 0) + (parseFloat(num2.value) || 0)">
                <p>
                    <label for="num1">First Number:</label>
                    <input type="number" id="num1" name="num1" value="0">
                </p>
                
                <p>
                    <label for="num2">Second Number:</label>
                    <input type="number" id="num2" name="num2" value="0">
                </p>

                <p>
                    <strong>Total Sum:</strong> 
                    <output name="total" for="num1 num2">0</output>
                </p>
            </form>
        </div>
    </div>

    <hr>

    <!-- 4. Footer Section -->
    <div>
        <p>&copy; 2026 Lab Exercise 3. All Rights Reserved. | Contact: support@example.com</p>
    </div>

</body>
</html>
